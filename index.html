<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>😏 Done</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
    font-family:Arial;
    text-align:center;
}

img{
    max-width:90%;
    max-height:70vh;
    border-radius:12px;
}

h1{
    margin-bottom:10px;
    color:#FFD500;
    font-size:34px;
}

p{
    opacity:0.8;
    font-size:20px;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#FFD500;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>😏 WELL DONE</h1>

<img src="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif">

<p>Чайочок — done ☕️</p>

<!-- кнопка якщо авто не спрацює -->
<button onclick="playSound()">🔊 Увімкнути звук</button>

<audio id="sound" src="https://www.myinstants.com/media/sounds/nice.mp3"></audio>

<script>
const audio = document.getElementById("sound");

// пробуємо автостарт
window.addEventListener("load", () => {
    audio.play().catch(() => {
        console.log("Автозвук заблокований браузером");
    });
});

// ручний запуск
function playSound(){
    audio.play();
}
</script>

</body>
</html>

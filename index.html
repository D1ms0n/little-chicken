<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 New Episode</title>

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

/* затемнення */
.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(180deg, rgba(0,0,0,0.8), rgba(0,0,0,1));
}

/* центр */
.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:90%;
}

h1{
    font-size:36px;
    color:#FFD500;
    margin-bottom:10px;
}

h2{
    font-size:22px;
    opacity:0.8;
}

.big{
    font-size:42px;
    margin:20px 0;
}

/* telegram bubbles */
.chats{
    position:absolute;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.chat{
    background:#1f2a38;
    padding:10px 15px;
    border-radius:20px;
    font-size:14px;
    opacity:0.9;
    animation:float 6s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="center">
    <h2>🎬 Нова серія</h2>
    <h1>Dasha Little Kurochka</h1>

    <div class="big">
        НОВЕ ПОБАЧЕННЯ
    </div>

    <p style="opacity:0.7;">
        Всі чекають продовження...
    </p>
</div>

<!-- Telegram-style reactions -->
<div class="chats">

<div class="chat">👀 Що там буде?</div>
<div class="chat">😏 після такого першого разу...</div>
<div class="chat">🔥 я ставлю що буде ще краще</div>
<div class="chat">😂 366 були праві</div>
<div class="chat">❤️ вона прийде?</div>
<div class="chat">👀 це вже серіал</div>
<div class="chat">🍿 чекаю розвиток</div>
<div class="chat">😄 чайочок буде?</div>

</div>

</body>
</html>

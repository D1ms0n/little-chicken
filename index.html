<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 New Episode</title>

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:white;
    font-family:Arial;
}

/* 18+ */
.badge{
    position:fixed;
    top:15px;
    right:15px;
    background:#ff2e2e;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
}

/* layout */
.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    text-align:center;
}

/* текст */
h1{
    font-size:34px;
    color:#FFD500;
    margin:10px 0;
}

h2{
    opacity:0.7;
}

.big{
    font-size:42px;
    margin:20px 0;
}

/* чати */
.chats{
    margin-top:40px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    max-width:500px;
}

.chat{
    background:#1f2a38;
    padding:10px 15px;
    border-radius:20px;
    font-size:14px;
    opacity:0.9;
    max-width:90%;
}

/* адаптив */
@media (max-width:400px){
    .big{
        font-size:32px;
    }
}
</style>
</head>

<body>

<div class="badge">🔞 18+</div>

<div class="container">

    <h2>🎬 Нова серія</h2>
    <h1>Dasha Little Kurochka</h1>

    <div class="big">
        НОВЕ ПОБАЧЕННЯ
    </div>

    <p style="opacity:0.6;">
        Всі чекають продовження...
    </p>

    <div class="chats">
        <div class="chat">👀 Що там буде?</div>
        <div class="chat">😏 після такого першого разу...</div>
        <div class="chat">🔥 я ставлю що буде ще краще</div>
        <div class="chat">😂 366 були праві</div>
        <div class="chat">❤️ вона прийде?</div>
        <div class="chat">👀 це вже серіал</div>
        <div class="chat">🍿 чекаю розвиток</div>
        <div class="chat">😄 чайочок буде?</div>
    </div>

</div>

</body>
</html>

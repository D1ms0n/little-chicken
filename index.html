<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бінго: Холостяк 15</title>
<style>
:root{
  --bg:#0d0b0e;
  --card:#1c1820;
  --line:#2e2833;
  --text:#f6eef2;
  --muted:#a99aa4;
  --red:#e0302a;
  --rose:#ff5d8f;
  --gold:#ffc94a;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at top,#2a1220 0%,var(--bg) 60%);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 16px 40px;
}
header{text-align:center;max-width:520px}
.kicker{
  font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-weight:700;
}
h1{
  margin:6px 0 4px;font-size:clamp(40px,12vw,64px);line-height:1;color:var(--red);
  font-weight:900;letter-spacing:-.02em;
}
.sub{color:var(--muted);font-size:15px;margin:0 0 20px}
.progress{
  font-size:14px;color:var(--muted);margin-bottom:14px;text-align:center;
}
.progress b{color:var(--gold)}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:100%;
  max-width:520px;
}
@media (min-width:600px){ .grid{grid-template-columns:repeat(3,1fr)} }

.cell{
  position:relative;
  aspect-ratio:1/1;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:16px;
  padding:12px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:15px;line-height:1.3;font-weight:600;color:var(--text);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:transform .12s ease, background .2s ease, border-color .2s ease;
}
.cell:active{transform:scale(.96)}
.cell .emoji{display:block;font-size:28px;margin-bottom:6px}
.cell.special{border-color:var(--gold)}
.cell.on{
  background:linear-gradient(145deg,var(--red),#a3162a);
  border-color:var(--red);
}
.cell.on::after{
  content:"🌹";
  position:absolute;top:6px;right:8px;font-size:20px;
}

.actions{margin-top:20px;display:flex;gap:10px}
button.reset{
  background:transparent;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:10px 18px;font-size:14px;cursor:pointer;
}

/* win screen */
.win{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;z-index:10;text-align:center;
}
.win.show{display:flex;animation:pop .35s ease}
.win h2{font-size:clamp(56px,18vw,96px);margin:0;color:var(--gold);font-weight:900}
.win p{color:var(--text);font-size:18px;margin:8px 0 18px}
.win img{width:100%;max-width:420px;border-radius:16px}
.win button{
  margin-top:18px;background:var(--red);color:#fff;border:0;border-radius:999px;
  padding:12px 24px;font-size:16px;font-weight:700;cursor:pointer;
}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

.confetti{position:fixed;top:-20px;font-size:24px;pointer-events:none;z-index:11;
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>

<header>
  <div class="kicker">Холостяк · 15 сезон</div>
  <h1>БІНГО</h1>
  <p class="sub">Тисни на клітинку, коли це сталося. Закрий усі — і перемога твоя.</p>
</header>

<div class="progress" id="progress"></div>
<div class="grid" id="grid"></div>

<div class="actions">
  <button class="reset" id="reset">Почати заново</button>
</div>

<div class="win" id="win">
  <h2>БІНГО!</h2>
  <p>Усе збулося. Троянда твоя 🌹</p>
  <img src="IMG_0073.jpeg" alt="Так!">
  <button id="again">Грати ще</button>
</div>

<script>
const items = [
  { e:"🐔", t:"Учасниця прийшла з твариною" },
  { e:"📏", t:"Жарт про зріст Холостяка" },
  { e:"🏀", t:"Хтось кидає м'яч у кошик" },
  { e:"😭", t:"Сльози перед церемонією троянд" },
  { e:"💬", t:"«Я прийшла сюди за коханням, а не за шоу»" },
  { e:"📺", t:"Влад вже дивиться холостяка", special:true },
];

const KEY = "bingo-holostyak-15";
let state = load();

function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length===items.length) return s; } catch(e){}
  return items.map(()=>false);
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const grid = document.getElementById("grid");
const progress = document.getElementById("progress");
const win = document.getElementById("win");

function render(){
  grid.innerHTML = "";
  items.forEach((it,i)=>{
    const c = document.createElement("div");
    c.className = "cell" + (state[i] ? " on" : "") + (it.special ? " special" : "");
    c.innerHTML = `<div><span class="emoji">${it.e}</span>${it.t}</div>`;
    c.onclick = () => toggle(i);
    grid.appendChild(c);
  });
  const n = state.filter(Boolean).length;
  progress.innerHTML = `Закрито <b>${n}</b> з ${items.length}`;
}

function toggle(i){
  state[i] = !state[i];
  save(); render();
  if (state.every(Boolean)) celebrate();
}

function celebrate(){
  win.classList.add("show");
  const bits = ["🌹","💍","🏀","🐔","✨","❤️"];
  for (let k=0;k<40;k++){
    const s = document.createElement("div");
    s.className = "confetti";
    s.textContent = bits[k % bits.length];
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (2 + Math.random()*2) + "s";
    s.style.animationDelay = (Math.random()*0.8) + "s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 5000);
  }
}

function reset(){
  state = items.map(()=>false);
  save(); render(); win.classList.remove("show");
}

document.getElementById("reset").onclick = reset;
document.getElementById("again").onclick = reset;
render();
</script>
</body>
</html>
